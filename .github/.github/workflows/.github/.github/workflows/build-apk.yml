name: Build Axiom Turbo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Accept Android SDK licenses
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -z "$SDK_ROOT" ] && SDK_ROOT="/usr/local/lib/android/sdk"
          echo "SDK root: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses || true
          else
            find "$SDK_ROOT" -name sdkmanager 2>/dev/null || true
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-turbo-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
